# PostgreSQL for local development. Start with:  docker compose up -d
services:
  db:
    image: postgres:16
    container_name: auspak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auspak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auspak_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-auspak}
    ports:
      - "5433:5432"
    volumes:
      - auspak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auspak -d auspak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auspak_pgdata:
